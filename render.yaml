services:
  - type: web
    name: sutra-mini-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MOCK_MODE
        value: success
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
